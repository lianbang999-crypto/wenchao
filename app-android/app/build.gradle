/*
 * 印祖文钞 · 离线阅读应用
 *
 * 本文件原是 bubblewrap 生成的 TWA 模板（内容全靠联网现取），
 * 已改为自建 WebView + 随包内容的离线应用，故不再保留模板的那套 twaManifest 变量。
 * 站点内容由 scripts/build_app_assets.py 同步进 src/main/assets/，
 * 打包前务必先跑一次，否则装出来的是个没有经文的空壳。
 */
plugins {
    id 'com.android.application'
}

android {
    namespace "org.foyue.wenchao"
    compileSdk 36

    defaultConfig {
        applicationId "org.foyue.wenchao"
        // 保持 21：不主动放弃老机器。内核太旧跑不动阅读器的情况，
        // 由 MainActivity 检出后给一页说明，而不是让人对着白屏猜。
        minSdk 21
        targetSdk 36
        versionCode 9
        versionName "1.1.3"

        resValue "string", "appName", "印光法师文钞"
        resValue "string", "launcherName", "印祖文钞"
        resValue "color", "backgroundColor", "#FCFAF6"
    }

    buildFeatures {
        // AGP 8 起默认不生成 BuildConfig；MainActivity/NativeBridge 要读
        // BuildConfig.VERSION_NAME 拼启动地址与版本比对，必须打开。
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            // 原模板开了 minify 却没给规则文件，等于放任 R8 按空配置裁剪。
            // 当前侥幸没出事，但 WebView 的 JS 接口是靠反射调用的，必须显式保住。
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        // woff2 本身已是压缩格式，再压一轮既省不下体积，又平白多一次解压开销
        noCompress += ['woff2']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'   // WebViewAssetLoader / WebViewCompat
    implementation 'androidx.core:core:1.13.1'       // FileProvider
}
