/*
 * 印祖文钞 · 离线阅读应用
 *
 * 本文件原是 bubblewrap 生成的 TWA 模板（内容全靠联网现取），
 * 已改为自建 WebView + 随包内容的离线应用，故不再保留模板的那套 twaManifest 变量。
 * 站点内容由 scripts/build_app_assets.py 同步进 src/main/assets/，
 * 打包前务必先跑一次，否则装出来的是个没有经文的空壳。
 */
plugins {
    id 'com.android.application'
}

android {
    namespace "org.foyue.wenchao"
    compileSdk 36

    defaultConfig {
        applicationId "org.foyue.wenchao"
        // Android 4.4（API 19）仍有不少可用的低端设备；原生兼容分支
        // 会在运行时选择旧版 WebView 回调和 TTS 接口。
        minSdk 19
        targetSdk 36
        versionCode 10
        versionName "1.1.4"
        testInstrumentationRunner "org.foyue.wenchao.CompatibilitySmokeTest"

        resValue "string", "appName", "印光法师文钞"
        resValue "string", "launcherName", "印祖文钞"
        resValue "color", "backgroundColor", "#FCFAF6"
    }

    buildFeatures {
        // AGP 8 起默认不生成 BuildConfig；MainActivity/NativeBridge 要读
        // BuildConfig.VERSION_NAME 拼启动地址与版本比对，必须打开。
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            // 原模板开了 minify 却没给规则文件，等于放任 R8 按空配置裁剪。
            // 当前侥幸没出事，但 WebView 的 JS 接口是靠反射调用的，必须显式保住。
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        // woff2 本身已是压缩格式，再压一轮既省不下体积，又平白多一次解压开销
        noCompress += ['woff2']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // 1.12.x 起将最低版本提高到 API 21；1.9.0 保留 API 19 支持，且仍提供
    // WebViewAssetLoader / WebViewCompat。
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.13.1'       // FileProvider
}
