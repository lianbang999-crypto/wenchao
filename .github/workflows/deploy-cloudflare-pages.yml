name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static output
        run: |
          test -f site/index.html
          test -f site/data/books.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify reading, offline, AI and content regressions
        run: |
          python3 -m pip install --disable-pip-version-check --quiet python-docx
          node --test workers/ai-proxy/*.test.mjs scripts/*.test.mjs
          python3 scripts/check_content.py
          python3 -m unittest discover -s scripts -p 'test_numbered_parallel.py'
          node tools/verify.js

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler@4 pages deploy site --project-name=wenchao --branch=main
